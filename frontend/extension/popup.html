<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JobRadar Agent</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0b111e;
      color: #e7edf8;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #21314a;
    }
    .brand {
      font-weight: 800;
      font-size: 1.1rem;
    }
    .brand span { color: #4ea3ff; }
    .badge {
      font-size: 0.75rem;
      background: rgba(47, 178, 130, 0.2);
      color: #2fb282;
      border: 1px solid #2fb282;
      padding: 2px 6px;
      border-radius: 999px;
      font-weight: 700;
    }
    .btn-apply {
      width: 100%;
      background: linear-gradient(135deg, #0a66c2 0%, #004182 100%);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(10, 102, 194, 0.4);
      margin-top: 10px;
    }
    .btn-apply:hover {
      opacity: 0.95;
    }
    .status-box {
      margin-top: 12px;
      padding: 10px;
      background: #101a2a;
      border: 1px solid #21314a;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #9aa9c3;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Job<span>Radar</span></div>
    <span class="badge">ATS Agent</span>
  </div>

  <p style="font-size: 0.85rem; margin: 0 0 8px 0; color: #9aa9c3;">
    Auto-fill candidate profile, answers, and tailored resume on Greenhouse, Lever, Workday, or Ashby.
  </p>

  <button id="btnAutoFill" class="btn-apply">⚡ Auto-Fill This Application</button>

  <div id="statusBox" class="status-box">
    Ready on current tab. Click to scan form.
  </div>

  <script src="popup.js"></script>
</body>
</html>
